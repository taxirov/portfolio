[build]
  # Migrations run before `next build` because the build pre-renders pages from the database.
  command = "prisma generate && prisma migrate deploy && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# The site was first created from a static branch, so the Next.js runtime is not added automatically.
[[plugins]]
  package = "@netlify/plugin-nextjs"
